<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellung</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #22c55e; 
            --primary-hover: #16a34a;
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --input-bg: #ffffff;
            --text-main: #1e293b;
            --accent: #16a34a;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container { width: 100%; max-width: 500px; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 { 
            font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 25px; 
            color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .input-group { margin-bottom: 25px; position: relative; }
        label { display: block; font-size: 14px; font-weight: 700; color: #000; margin-bottom: 8px; }

        input, select {
            width: 100%; padding: 12px 15px; 
            background: var(--input-bg);
            border: 1.5px solid #cbd5e1; 
            border-radius: 10px;
            color: var(--text-main); 
            font-size: 16px; 
            transition: all 0.2s; 
            box-sizing: border-box;
        }

        .sold-out { background-color: #fee2e2 !important; color: #ef4444 !important; }

        input:focus, select:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .section-title { 
            margin-top: 20px; margin-bottom: 8px; font-weight: 700; font-size: 13px; 
            color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
        }
        
        .btn-add {
            background: var(--primary); color: white; border: none;
            width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; 
            font-size: 16px; font-weight: 700; margin-top: 8px; margin-bottom: 20px;
            transition: background 0.2s;
        }

        #basket {
            margin-top: 25px; background: #f8fafc;
            border-radius: 12px; padding: 20px; border: 2px dashed #cbd5e1;
        }

        .basket-item-container { padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
        .basket-item { display: flex; justify-content: space-between; align-items: center; }
        .qty-controls { display: flex; align-items: center; gap: 12px; }
        .btn-qty { background: #e2e8f0; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-weight: bold; font-size: 18px; }

        .item-note {
            width: 100%; margin-top: 8px; font-size: 13px; border: 1px solid #e2e8f0;
            padding: 8px; border-radius: 8px; background: #fff; box-sizing: border-box;
        }

        .tip-container {
            margin-top: 15px; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap;
        }
        .btn-tip {
            flex: 1; min-width: 50px; background: #fff; border: 1.5px solid #cbd5e1; padding: 8px; border-radius: 8px;
            font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-tip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Eigenes Trinkgeld Feld - Erweitert */
        .custom-tip-wrapper {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .custom-input-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .custom-input-box label { font-size: 10px; margin: 0; color: #64748b; }
        .custom-input-box input { width: 70px; text-align: center; padding: 6px; font-size: 14px; }

        .total-row { font-size: 18px; font-weight: 700; text-align: right; margin-top: 15px; padding-top: 10px; border-top: 2px solid #e2e8f0; line-height: 1.4; }
        .total-row small { font-size: 14px; color: #64748b; font-weight: normal; }

        .btn-send {
            width: 100%; margin-top: 25px; padding: 18px; background: var(--accent);
            color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: 800;
            cursor: pointer; box-shadow: 0 4px 6px rgba(34, 197, 94, 0.2); transition: 0.2s;
        }

        .btn-clear { background: transparent; color: #64748b; border: none; width: 100%; margin-top: 15px; cursor: pointer; font-size: 13px; text-decoration: underline; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: white; color: var(--accent); padding: 15px 30px; border-radius: 50px;
            font-weight: 800; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); z-index: 2000;
            border: 2px solid var(--accent); animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown { from { top: -60px; opacity: 0; } to { top: 20px; opacity: 1; } }
        
        input.error { border-color: var(--danger); background: #fff1f2; animation: shake 0.4s ease-in-out; }
        .error-hint { color: var(--danger); font-size: 12px; font-weight: bold; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2>📝 Bestellung</h2>
        
        <div class="input-group">
            <label id="tableLabel">Tischnummer:</label>
            <input type="number" id="tableNumber" placeholder="Tischnummer">
            <div id="errorText" class="error-hint">Bitte gib eine Tischnummer ein!</div>
        </div>

        <div class="section-title">🥤 Getränke</div>
        <select id="selectGetraenke"><option value="" disabled selected>Wählen.</option></select>
        <button class="btn-add" onclick="addToBasket('selectGetraenke')">+ Hinzufügen</button>

        <div class="section-title">🍕 Speisen</div>
        <select id="selectSpeisen"><option value="" disabled selected>Wählen.</option></select>
        <button class="btn-add" onclick="addToBasket('selectSpeisen')">+ Hinzufügen</button>

        <div class="section-title">🍰 Nachspeisen</div>
        <select id="selectNachspeisen"><option value="" disabled selected>Wählen.</option></select>
        <button class="btn-add" onclick="addToBasket('selectNachspeisen')">+ Hinzufügen</button>

        <div id="basket">
            <div style="font-weight: 700; margin-bottom: 10px;">Dein Warenkorb:</div>
            <div id="basketList"><span>Noch leer.</span></div>
            
            <div id="tipBox" style="display: none; margin-top: 15px;">
                <div style="font-size: 12px; font-weight: bold; color: var(--primary); text-align: center;">TRINKGELD:</div>
                <div class="tip-container">
                    <button class="btn-tip active" id="tip0" onclick="setTip(0)">0%</button>
                    <button class="btn-tip" id="tip5" onclick="setTip(5)">5%</button>
                    <button class="btn-tip" id="tip10" onclick="setTip(10)">10%</button>
                    <button class="btn-tip" id="tip20" onclick="setTip(20)">20%</button>
                </div>
                
                <div class="custom-tip-wrapper">
                    <div class="custom-input-box">
                        <label>Eigene %</label>
                        <input type="number" id="customTipPercent" placeholder="%" oninput="calcTipFromPercent(this.value)">
                    </div>
                    <div style="font-weight: bold; color: #cbd5e1; margin-top: 12px;">oder</div>
                    <div class="custom-input-box">
                        <label>Eigener Betrag €</label>
                        <input type="number" id="customTipEuro" placeholder="€" step="0.10" oninput="calcTipFromEuro(this.value)">
                    </div>
                </div>
            </div>

            <div id="totalDisplay"></div>
            <button class="btn-clear" onclick="clearBasket()">Warenkorb leeren</button>
        </div>

        <button class="btn-send" onclick="sendOrder()">🚀 JETZT BESTELLEN 🚀</button>
    </div>
</div>

<div id="toast" class="toast">✅ Bestellung gesendet!</div>

<script>
    const firebaseConfig = { databaseURL: "https://mein-restaurante-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentBasket = {}; 
    let menuPrices = {};
    let menuCats = {}; 
    let maxTables = 30;
    
    // Trinkgeld Logik
    let subtotalValue = 0;
    let finalTipAmount = 0;
    let tipTypeLabel = "0%";

    db.ref('settings/tableCount').on('value', (s) => {
        if(s.exists()) {
            maxTables = parseInt(s.val());
            document.getElementById('tableNumber').max = maxTables;
            document.getElementById('tableLabel').innerText = `Tischnummer (1 bis ${maxTables}):`;
        }
    });

    db.ref('restaurantMenu').on('value', (s) => {
        const menu = s.val();
        const sG = document.getElementById('selectGetraenke'), sS = document.getElementById('selectSpeisen'), sN = document.getElementById('selectNachspeisen');
        sG.innerHTML = sS.innerHTML = sN.innerHTML = '<option value="" disabled selected>Wählen.</option>';
        if (menu) {
            Object.values(menu).forEach(item => {
                const isAvailable = item.available !== false;
                menuPrices[item.name] = item.price || "0.00";
                menuCats[item.name] = item.cat || "S";
                let opt = document.createElement('option');
                opt.value = item.name;
                if (!isAvailable) {
                    opt.text = `${item.name} - AUSVERKAUFT`;
                    opt.disabled = true;
                    opt.className = "sold-out";
                } else {
                    opt.text = `${item.name} (${parseFloat(item.price).toFixed(2)}€)`;
                }
                if(item.cat === "G") sG.appendChild(opt); 
                else if(item.cat === "N") sN.appendChild(opt); 
                else sS.appendChild(opt);
            });
        }
    });

    function setTip(val) {
        document.querySelectorAll('.btn-tip').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tip' + val).classList.add('active');
        document.getElementById('customTipPercent').value = "";
        document.getElementById('customTipEuro').value = "";
        
        finalTipAmount = subtotalValue * (val / 100);
        tipTypeLabel = val + "%";
        updateUI();
    }

    function calcTipFromPercent(val) {
        const p = parseFloat(val) || 0;
        document.querySelectorAll('.btn-tip').forEach(btn => btn.classList.remove('active'));
        
        finalTipAmount = subtotalValue * (p / 100);
        document.getElementById('customTipEuro').value = finalTipAmount.toFixed(2);
        tipTypeLabel = p + "%";
        updateUI();
    }

    function calcTipFromEuro(val) {
        const euro = parseFloat(val) || 0;
        document.querySelectorAll('.btn-tip').forEach(btn => btn.classList.remove('active'));
        
        finalTipAmount = euro;
        const p = subtotalValue > 0 ? (euro / subtotalValue) * 100 : 0;
        document.getElementById('customTipPercent').value = p.toFixed(1);
        tipTypeLabel = "Indiv.";
        updateUI();
    }

    function addToBasket(id) {
        const select = document.getElementById(id);
        const val = select.value;
        if (!val) return;
        if (!currentBasket[val]) currentBasket[val] = { qty: 1, note: "" };
        else currentBasket[val].qty += 1;
        select.selectedIndex = 0; 
        updateUI();
    }

    function changeQty(name, d) {
        currentBasket[name].qty += d;
        if (currentBasket[name].qty <= 0) delete currentBasket[name];
        updateUI();
    }

    function updateNote(name, text) {
        if(currentBasket[name]) currentBasket[name].note = text;
    }

    function updateUI() {
        const l = document.getElementById('basketList'), keys = Object.keys(currentBasket);
        const t = document.getElementById('totalDisplay');
        const tipBox = document.getElementById('tipBox');
        
        subtotalValue = 0;

        if (!keys.length) {
            l.innerHTML = '<span>Noch leer.</span>';
            t.innerHTML = "";
            tipBox.style.display = 'none';
            return;
        }

        tipBox.style.display = 'block';
        l.innerHTML = keys.map(n => {
            let itemPrice = parseFloat(menuPrices[n]) || 0;
            subtotalValue += itemPrice * currentBasket[n].qty;
            return `
            <div class="basket-item-container">
                <div class="basket-item">
                    <span>${n} (${itemPrice.toFixed(2)}€)</span>
                    <div class="qty-controls">
                        <button class="btn-qty" onclick="changeQty('${n}',-1)">-</button>
                        <b>${currentBasket[n].qty}</b>
                        <button class="btn-qty" onclick="changeQty('${n}',1)">+</button>
                    </div>
                </div>
                <input type="text" class="item-note" placeholder="Zusatzwunsch..." 
                       value="${currentBasket[n].note}" 
                       oninput="updateNote('${n}', this.value)">
            </div>`;
        }).join("");

        // Falls ein fester Button aktiv war, Betrag neu berechnen
        const activeBtn = document.querySelector('.btn-tip.active');
        if(activeBtn) {
            const val = parseInt(activeBtn.innerText);
            finalTipAmount = subtotalValue * (val / 100);
            tipTypeLabel = val + "%";
        }

        let finalTotal = subtotalValue + finalTipAmount;

        t.innerHTML = `
            <div class="total-row">
                <small>Zwischensumme: ${subtotalValue.toFixed(2)} €</small><br>
                <small>Trinkgeld (${tipTypeLabel}): ${finalTipAmount.toFixed(2)} €</small><br>
                Gesamt: ${finalTotal.toFixed(2)} €
            </div>`;
    }

    function clearBasket() { 
        currentBasket = {}; 
        finalTipAmount = 0;
        document.getElementById('customTipPercent').value = "";
        document.getElementById('customTipEuro').value = "";
        document.querySelectorAll('.btn-tip').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tip0').classList.add('active');
        updateUI(); 
    }

    function sendOrder() {
        const tableInput = document.getElementById('tableNumber');
        const table = parseInt(tableInput.value);
        const items = Object.keys(currentBasket);

        if (!table || table < 1 || table > maxTables) {
            tableInput.classList.add('error');
            document.getElementById('errorText').style.display = 'block';
            return;
        }

        if (!items.length) return alert("Warenkorb leer!");

        let categoriesFound = [];
        let itemsListForKitchen = []; 

        const productSummary = items.map(n => {
            let qty = currentBasket[n].qty;
            let cat = menuCats[n];
            let note = currentBasket[n].note;
            if(!categoriesFound.includes(cat)) categoriesFound.push(cat);
            itemsListForKitchen.push({ name: n, count: qty, cat: cat, note: note });
            return `${qty}x ${n}${note ? ' ('+note+')' : ''}`;
        }).join(", ");

        let finalTotalStr = (subtotalValue + finalTipAmount).toFixed(2);

        db.ref('kitchenOrders').push({
            product: productSummary, 
            itemsList: itemsListForKitchen, 
            total: finalTotalStr + " €",
            totalPrice: finalTotalStr,
            table: table,
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
            timestamp: Date.now(),
            status: "new",
            categories: categoriesFound 
        }).then(() => { 
            clearBasket(); 
            tableInput.value = "";
            showToast();
        });
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
</script>
</body>
</html>
